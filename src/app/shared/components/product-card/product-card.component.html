<article class="kk-card">
  <a [routerLink]="['/product', product.id]" class="kk-card__media" kkTilt [kkTiltMax]="6">
    <span class="kk-card__tag" *ngIf="discountPercent > 0">Sale</span>
    <img [src]="product.image" [alt]="product.name" loading="lazy" />
  </a>
  <div class="kk-card__body">
    <span class="kk-card__category">{{ product.category }}</span>
    <h3 class="kk-card__title">
      <a [routerLink]="['/product', product.id]">{{ product.name }}</a>
    </h3>
    <div class="kk-card__price">
      <span class="kk-card__price--strike" *ngIf="discountPercent > 0">&#8377;{{ product.price | number }}</span>
      <span class="kk-card__price--sale">&#8377;{{ product.salePrice | number }}</span>
    </div>
    <div class="kk-card__actions">
      <button type="button" class="kk-btn kk-btn--outline kk-card__cta" (click)="addToCart($event)">
        {{ justAdded ? 'Added ✓' : 'Add to Cart' }}
      </button>
      <a class="kk-btn kk-btn--primary kk-card__cta" [routerLink]="['/checkout', product.id]">
        Buy Now
      </a>
    </div>
  </div>
</article>
